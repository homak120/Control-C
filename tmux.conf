# tmux settings for the Control-C tmux server (socket "control-c").
# Your own ~/.tmux.conf and tmux sessions are never affected.

# Feel like a plain terminal: no status bar, mouse scrolling works.
set -g status off
set -g mouse on
set -g history-limit 50000

# Pass colors, focus events and Esc through unchanged; Claude Code's TUI relies on them.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on
set -sg escape-time 0
set -g extended-keys on

# Size each window to the terminal that's actually looking at it.
set -g window-size latest
set -g aggressive-resize on

# Keep the pane after Claude exits so you can read the last screen.
set -g remain-on-exit on
